<div class="flex items-center justify-center h-screen">
  <ion-card class="glass-card w-full max-w-sm">
    <ion-card-content>
      <h2 class="text-2xl font-bold mb-6 text-center text-white">Admin Login</h2>
      <form>
        <div class="form-group mb-4">
          <label for="username" class="form-label block text-white text-sm font-bold mb-2">Username</label>
          <ion-input type="text" id="username" name="username"
                     class="form-field w-full px-3 py-2 text-white leading-tight focus:outline-none focus:shadow-outline rounded-lg"
                     placeholder="Enter your username"></ion-input>
        </div>
        <div class="form-group mb-6">
          <label for="password" class="form-label block text-white text-sm font-bold mb-2">Password</label>
          <ion-input type="password" id="password" name="password"
                     class="form-field w-full px-3 py-2 text-white leading-tight focus:outline-none focus:shadow-outline rounded-lg"
                     placeholder="Enter your password"></ion-input>
        </div>
        <div class="flex items-center justify-between">
          <ion-button type="submit" expand="block"
                      class="w-full bg-blue-600/50 hover:bg-blue-700/60 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline">
            Sign In
          </ion-button>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</div>
